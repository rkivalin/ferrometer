name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libsystemd-dev pkg-config
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
