# Ferrometer configuration
#
# All durations use suffix notation: "15s", "5m", "1h"

[instance]
# Unique name for this host. Added as "instance" label to all metrics.
name = "myhost"

# Metrics pipeline: collectors gather data, forwarders push it out.
# Multiple collectors and forwarders can be configured.

[metrics.collectors.system]
type = "unix"

# Collection interval (default: "15s")
interval = "15s"

# Regex filter for disk devices to monitor (default: common block devices)
# Only devices matching this pattern will be reported.
disk-devices = "^(nvme\\d+n\\d+|sd[a-z]+|vd[a-z]+)$"

# Regex filter for network interfaces to monitor
net-devices = "^(eth|en|wl|bond)"

# Sub-collectors to enable (default: all)
# Available: cpu, memory, disk, filesystem, netdev, loadavg, uname
collectors = ["cpu", "memory", "disk", "filesystem", "netdev", "loadavg", "uname"]

# Prometheus scraper — pulls a text-exposition /metrics endpoint on an
# interval. Counter, Gauge, and Untyped samples are forwarded; Histogram
# and Summary are dropped with a debug log (ferrometer's internal metric
# model is currently Gauge/Counter only). Scrape failures log a warning
# and emit no metrics for that tick (no stale last-seen emission).
# [metrics.collectors.haproxy]
# type = "prometheus"
# url = "http://127.0.0.1:9021/metrics"
# interval = "15s"
# scrape-timeout = "10s"
# # Optional basic auth:
# # username = "scraper"
# # password-file = "/run/credentials/ferrometer/haproxy-password"
#
# # Static labels merged into every scraped metric. `instance` is
# # auto-injected from [instance.name] and does not need listing here.
# [metrics.collectors.haproxy.static-labels]
# job = "haproxy"

[metrics.forwarders.victoriametrics]
type = "otlphttp"

# OTLP HTTP endpoint. "/v1/metrics" is appended automatically if not present.
endpoint = "http://metrics.example.com:8428/opentelemetry"

# Basic auth credentials (optional)
username = "write_myhost"

# Path to file containing the password (one line, trimmed).
# Supports systemd encrypted credentials via LoadCredentialEncrypted.
password-file = "/run/credentials/ferrometer/otlp-password"

# Compression: "gzip" (default) or "none"
compression = "gzip"

# HTTP request timeout (default: "30s")
timeout = "30s"

# Ring buffer cap for in-flight and not-yet-delivered metrics. When the buffer
# overflows, the oldest batches are dropped. Default 100000 metrics — roughly
# 20 MB of process memory worst case, covering a ~2 hour outage at typical
# scrape rates.
buffer-max-metrics = 100000

# Upper bound on the number of metrics merged into a single OTLP request.
# During recovery after an outage, the forwarder merges buffered batches up
# to this cap, so catch-up takes a handful of large requests instead of one
# per scrape tick. Default 10000.
request-max-metrics = 10000

# Exponential backoff for failed deliveries. Starts at `backoff-initial` and
# doubles on each consecutive failure up to `backoff-max`. Resets on success.
backoff-initial = "1s"
backoff-max = "5m"

# Attributes attached to the OTLP Resource message (separate from per-metric
# labels). Useful for OTel semantic-convention compatibility with receivers
# that distinguish Resource-level identifiers from per-metric dimensions.
# Values may contain the placeholder ${instance.name} which is substituted
# with the top-level [instance.name] at forwarder build time.
# [metrics.forwarders.victoriametrics.resource-attributes]
# "service.instance.id" = "${instance.name}"
# "service.name" = "ferrometer"

# ---------------------------------------------------------------------------
# Logs. Each entry in [logs.shippers] pairs one source with one sink.
# Requires ferrometer to be built with the matching features (for example
# log-source-journald-systemd + log-sink-loki for the configuration below).
# The systemd journal is tailed from the saved cursor (or tail on first run)
# and shipped to Loki. No in-memory ring buffer — journald is the durable
# buffer; during a sink outage memory stays flat.
# ---------------------------------------------------------------------------

# [logs.shippers.journal]
#
# [logs.shippers.journal.source]
# type = "journald"
# # Optional tuning (shown with defaults):
# batch-size = 1000
# batch-wait = "5s"
# cursor-file = "/var/lib/ferrometer/journal.cursor"
# runtime-only = false       # true = only /run/log/journal (volatile)
#
# # source_field → loki_label_name (stream labels — low cardinality).
# [logs.shippers.journal.source.labels]
# "_SYSTEMD_UNIT" = "unit"
# "PRIORITY" = "priority"
#
# # Static labels added to every entry. "instance" is auto-injected from
# # [instance.name] and does not need to be listed here.
# [logs.shippers.journal.source.static-labels]
# job = "ferrometer"
#
# # source_field → structured metadata name (per-entry, queryable, does not
# # create new streams).
# [logs.shippers.journal.source.metadata]
# "_PID" = "pid"
# "SYSLOG_IDENTIFIER" = "syslog_identifier"
# "SYSLOG_FACILITY" = "syslog_facility"
# "_TRANSPORT" = "transport"
# "_HOSTNAME" = "hostname"
# "_BOOT_ID" = "boot_id"
# "_MACHINE_ID" = "machine_id"
# "_CMDLINE" = "cmdline"
#
# [logs.shippers.journal.sink]
# type = "loki"
# endpoint = "http://loki.example.com:3100"
# username = "write_myhost"
# password-file = "/run/credentials/ferrometer/loki-password"
