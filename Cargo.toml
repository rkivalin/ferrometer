[package]
name = "ferrometer"
version = "0.1.0"
edition = "2024"
description = "Lightweight telemetry collector"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
default = ["collector-unix", "forwarder-otlphttp"]
collector-unix = ["dep:procfs", "dep:regex", "dep:nix"]
forwarder-otlphttp = ["dep:prost", "dep:prost-types", "dep:reqwest", "dep:futures-util", "dep:bytes", "dep:tokio-util", "dep:async-compression"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["macros", "rt", "time", "signal", "sync", "fs"] }
async-trait = "0.1"

# Unix collector
procfs = { version = "0.17", optional = true }
regex = { version = "1", optional = true }
nix = { version = "0.29", features = ["fs", "feature"], optional = true }

# OTLP HTTP forwarder
prost = { version = "0.13", optional = true }
prost-types = { version = "0.13", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
futures-util = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
async-compression = { version = "0.4", features = ["tokio", "gzip"], optional = true }

# Encoding (for basic auth)
base64 = "0.22"

[build-dependencies]
prost-build = "0.13"
