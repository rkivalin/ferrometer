# Ferrometer configuration reference.
#
# All durations use suffix notation: "15s", "5m", "1h".
#
# String values may contain placeholders, resolved at config load time:
#   ${instance.name}    — [instance].name from this file
#   ${version}          — ferrometer's own version
#   ${env:VAR}          — environment variable (unset → hard error)
#
# Under the shipped systemd unit, systemd sets STATE_DIRECTORY and (when
# LoadCredentialEncrypted= is configured) CREDENTIALS_DIRECTORY, which the
# examples below reference via ${env:...}.

[instance]
# Unique name for this host. Use it in resource attributes / static labels;
# nothing is auto-injected.
name = "myhost"


# ----------------------------------------------------------------------------
# Metrics: collectors gather data, forwarders push it out. Multiple of each
# can be configured.
# ----------------------------------------------------------------------------

[metrics.collectors.system]
type = "unix"
# Collection interval (default: "15s").
interval = "15s"
# Hard deadline per collect() call. /proc reads are effectively instant; the
# default leaves headroom for statvfs on stale network mounts. (default: "5s")
max-runtime = "5s"
# Regex filter for disk devices. Only matching devices are reported.
disk-devices = "^(nvme\\d+n\\d+|sd[a-z]+|vd[a-z]+)$"
# Regex filter for network interfaces.
net-devices = "^(eth|en|wl|bond)"
# Filesystem mountpoint include-regex. Empty (default) matches all.
filesystem-mount-points = ""
# Filesystem-type include-regex. Empty (default) matches all.
filesystem-fs-types = ""
# Collapse mounts that share a block device down to one canonical entry.
filesystem-dedupe-devices = true
# Sub-collectors to enable (default: all).
collectors = ["cpu", "memory", "disk", "filesystem", "netdev", "loadavg", "uname"]

# Static labels added to every emitted metric.
# [metrics.collectors.system.static-labels]
# role = "edge"


# Prometheus scraper — pulls a text-exposition /metrics endpoint on an
# interval. Counter / Gauge / Untyped samples are forwarded; Histogram and
# Summary are dropped with a debug log. Every tick also emits `up` (1/0),
# `scrape_duration_seconds` and `scrape_samples_scraped` with the static
# labels plus scraper="<name>". Scrape failures emit up=0 and no target
# samples for that tick (no stale last-seen emission); they are logged on
# transitions only (warn on down, info on recovery).
#
# [metrics.collectors.haproxy]
# type = "prometheus"
# url = "http://127.0.0.1:9021/metrics"
# interval = "15s"
# scrape-timeout = "10s"
# max-runtime = "15s"
#
# Auth (optional). See the forwarder section below for the full set of
# auth and TLS options — they apply to every HTTP client.
# username = "scraper"
# password-file = "${env:CREDENTIALS_DIRECTORY}/haproxy-password"
#
# Static labels merged into every scraped sample.
# [metrics.collectors.haproxy.static-labels]
# job = "haproxy"


# OTLP HTTP forwarder — pushes metrics to any OTLP/HTTP backend
# (VictoriaMetrics, Grafana Mimir, etc.). "/v1/metrics" is appended to the
# endpoint automatically if not present.
#
# [metrics.forwarders.victoriametrics]
# type = "otlphttp"
# endpoint = "http://metrics.example.com:8428/opentelemetry"
#
# Auth (pick one):
#   Basic:  username + (password OR password-file)
#   Bearer: bearer-token OR bearer-token-file
#   Custom: authorization (full Authorization header value)
# username = "ferrometer"
# password-file = "${env:CREDENTIALS_DIRECTORY}/otlp-password"
# bearer-token-file = "${env:CREDENTIALS_DIRECTORY}/otlp-token"
# authorization = "Bearer ${env:OTLP_TOKEN}"
#
# mTLS / custom CA (orthogonal to auth above). All three fields are optional;
# ca-cert-file alone gives you private-CA validation without mTLS, and
# client-key-file may be omitted if the key lives in client-cert-file.
# client-cert-file = "/etc/ferrometer/client.pem"
# client-key-file = "${env:CREDENTIALS_DIRECTORY}/client.key"
# ca-cert-file = "/etc/ferrometer/internal-ca.pem"
#
# Optional tuning (shown with defaults):
# compression = "gzip"            # "gzip" or "none"
# timeout = "30s"                 # HTTP request timeout
# buffer-max-metrics = 100000     # ring buffer cap; oldest batches drop on
#                                 # overflow. ~20 MB worst case, ~2 hour outage.
# request-max-metrics = 10000     # cap on metrics merged into a single OTLP request
# backoff-initial = "1s"          # exponential backoff for failed deliveries;
# backoff-max = "5m"              # doubles per consecutive failure up to backoff-max.
#
# Attributes attached to the OTLP Resource message (separate from per-metric
# labels). Useful for OTel semantic-convention compatibility with receivers
# that distinguish Resource-level identifiers from per-metric dimensions.
# [metrics.forwarders.victoriametrics.resource-attributes]
# "service.instance.id" = "${instance.name}"
# "service.name" = "ferrometer"
# "service.version" = "${version}"


# ----------------------------------------------------------------------------
# Logs: each [logs.shippers.<name>] entry pairs one source with one sink.
# The journald source seeks to the last acked cursor on start, so restarts
# don't lose or duplicate entries. journald itself is the durable buffer
# during a sink outage — there is no in-memory queue.
# ----------------------------------------------------------------------------

# [logs.shippers.journal]
# Exponential backoff for failed ships; doubles per consecutive failure up
# to backoff-max, resets on success.
# backoff-initial = "1s"
# backoff-max = "5m"
#
# [logs.shippers.journal.source]
# type = "journald"
# Optional tuning (shown with defaults). A batch closes when it reaches
# batch-size entries OR roughly batch-max-bytes of encoded payload, whichever
# comes first — the byte cap keeps a backlog of large entries from growing
# into a request the sink rejects (Loki's gRPC limit is 4 MiB). Accepts a
# byte count or "<n>K" / "<n>M" / "<n>G" (SI: 1M = 1000000; use "MiB" etc.
# for binary units); 0 disables the byte cap.
# batch-size = 1000
# batch-max-bytes = "1M"
# batch-wait = "5s"
# cursor-file = "${env:STATE_DIRECTORY}/journal.cursor"
# runtime-only = false       # true → only /run/log/journal (volatile)
#
# Stream labels: low-cardinality fields that group entries into Loki streams.
# label_name = journal_field. Entries missing the source field don't get
# the label.
# [logs.shippers.journal.source.labels]
# unit = "_SYSTEMD_UNIT"
# priority = "PRIORITY"
#
# Static labels added to every entry.
# [logs.shippers.journal.source.static-labels]
# job = "ferrometer"
#
# Per-entry structured metadata: queryable, does not create new streams.
# [logs.shippers.journal.source.metadata]
# pid = "_PID"
# syslog_identifier = "SYSLOG_IDENTIFIER"
# syslog_facility = "SYSLOG_FACILITY"
# transport = "_TRANSPORT"
# hostname = "_HOSTNAME"
# boot_id = "_BOOT_ID"
# machine_id = "_MACHINE_ID"
# cmdline = "_CMDLINE"
# container = "CONTAINER_NAME"
#
# [logs.shippers.journal.sink]
# type = "loki"
# endpoint = "http://loki.example.com:3100"
# All auth and TLS options listed above for the OTLP forwarder apply here too.
# username = "ferrometer"
# password-file = "${env:CREDENTIALS_DIRECTORY}/loki-password"
